<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8F4F2"/>
      <stop offset="50%" stop-color="#D7EBE6"/>
      <stop offset="100%" stop-color="#C5E3DC"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E8F4F2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="450" rx="20" fill="url(#heroBg)"/>
  <circle cx="450" cy="140" r="160" fill="url(#sunGlow)"/>

  <!-- Subtle Landscape Silhouettes -->
  <path d="M0 380 Q150 320 300 360 T600 340 L600 450 L0 450 Z" fill="#559E83" opacity="0.25"/>
  <path d="M0 405 Q200 360 400 395 T600 380 L600 450 L0 450 Z" fill="#008080" opacity="0.3"/>

  <!-- Protective Medical-Shield Badge -->
  <g transform="translate(180, 50)">
    <path d="M120 20 L40 55 V130 C40 190 75 245 120 260 C165 245 200 190 200 130 V55 L120 20 Z" 
          fill="#FFFFFF" stroke="#008080" stroke-width="6" stroke-linejoin="round"/>
    
    <!-- Inner Cross -->
    <rect x="110" y="80" width="20" height="100" rx="6" fill="#008080"/>
    <rect x="70" y="120" width="100" height="20" rx="6" fill="#008080"/>

    <!-- Coiling Caduceus/Asclepius Serpent -->
    <path d="M100 190 C100 160 140 160 140 130 C140 100 100 100 100 75 C100 65 110 58 120 58 C130 58 138 65 138 75" 
          stroke="#27AE60" stroke-width="9" stroke-linecap="round" fill="none"/>
    <circle cx="138" cy="72" r="6" fill="#27AE60"/>
    <circle cx="140" cy="70" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Floating Information Cards -->
  <!-- Floating Card 1: Emergency Protocol -->
  <g transform="translate(40, 260)">
    <rect width="210" height="90" rx="12" fill="#FFFFFF" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.06))"/>
    <rect x="16" y="18" width="8" height="54" rx="4" fill="#D9381E"/>
    <text x="36" y="38" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#D9381E">EMERGENCY PROTOCOL</text>
    <text x="36" y="56" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#202B2B">Immediate Transport</text>
    <text x="36" y="72" font-family="system-ui, sans-serif" font-size="10" fill="#5F6B6B">Keep calm &amp; immobilize limb</text>
  </g>

  <!-- Floating Card 2: Species Awareness -->
  <g transform="translate(360, 270)">
    <rect width="200" height="90" rx="12" fill="#FFFFFF" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.06))"/>
    <rect x="16" y="18" width="8" height="54" rx="4" fill="#27AE60"/>
    <text x="36" y="38" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#27AE60">SPECIES RECOGNITION</text>
    <text x="36" y="56" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#202B2B">Safe Observation</text>
    <text x="36" y="72" font-family="system-ui, sans-serif" font-size="10" fill="#5F6B6B">Never handle or corner</text>
  </g>
</svg>
