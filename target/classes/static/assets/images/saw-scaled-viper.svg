<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSaw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2ECE4"/>
      <stop offset="100%" stop-color="#DFD6C7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" rx="12" fill="url(#bgSaw)"/>
  
  <ellipse cx="200" cy="215" rx="145" ry="18" fill="#559E83" opacity="0.25"/>

  <!-- Serrated Coiled Figure-8 Body -->
  <path d="M120 180 C80 140, 160 120, 200 150 C240 180, 320 160, 280 120 C240 80, 160 100, 200 70" 
        stroke="#825C37" stroke-width="28" stroke-linecap="round" fill="none"/>

  <!-- White undulating side arcs / chevron marks -->
  <path d="M100 160 Q110 145 125 155" stroke="#FFFFFF" stroke-width="3.5" fill="none"/>
  <path d="M140 135 Q150 125 165 135" stroke="#FFFFFF" stroke-width="3.5" fill="none"/>
  <path d="M185 140 Q195 155 210 145" stroke="#FFFFFF" stroke-width="3.5" fill="none"/>
  <path d="M230 165 Q245 175 260 160" stroke="#FFFFFF" stroke-width="3.5" fill="none"/>
  <path d="M285 145 Q295 130 280 115" stroke="#FFFFFF" stroke-width="3.5" fill="none"/>
  <path d="M245 95 Q230 85 215 95" stroke="#FFFFFF" stroke-width="3.5" fill="none"/>
  <path d="M180 95 Q170 85 185 75" stroke="#FFFFFF" stroke-width="3.5" fill="none"/>

  <!-- Pear-shaped Head with White Cross/Bird's Foot Mark -->
  <ellipse cx="200" cy="65" rx="14" ry="12" fill="#5E3E20"/>
  <!-- Bird Foot / Cross mark on crown -->
  <line x1="200" y1="58" x2="200" y2="70" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="194" y1="63" x2="206" y2="63" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <line x1="195" y1="68" x2="205" y2="68" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

  <!-- Big golden eyes with vertical slit pupils -->
  <circle cx="190" cy="62" r="3" fill="#D4AF37"/>
  <line x1="190" y1="60" x2="190" y2="64" stroke="#000000" stroke-width="1.2"/>
  <circle cx="210" cy="62" r="3" fill="#D4AF37"/>
  <line x1="210" y1="60" x2="210" y2="64" stroke="#000000" stroke-width="1.2"/>

  <!-- Identification Badge -->
  <rect x="16" y="16" width="130" height="26" rx="6" fill="#D9381E" fill-opacity="0.15"/>
  <text x="24" y="34" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#D9381E">VENOMOUS (Big Four)</text>
</svg>
