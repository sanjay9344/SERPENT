<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bgKeel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF4F0"/>
      <stop offset="100%" stop-color="#D4E4DC"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" rx="12" fill="url(#bgKeel)"/>
  
  <ellipse cx="200" cy="215" rx="150" ry="18" fill="#559E83" opacity="0.25"/>

  <!-- Water ripple hint -->
  <ellipse cx="200" cy="210" rx="100" ry="8" fill="none" stroke="#559E83" stroke-width="1.5" opacity="0.4"/>

  <!-- Checkered body curving through wetland -->
  <path d="M70 205 C110 160, 160 230, 220 180 C270 140, 260 90, 200 90 C150 90, 140 140, 90 120 L80 110" 
        stroke="#59634C" stroke-width="22" stroke-linecap="round" fill="none"/>

  <!-- Checkered Pattern of black square dots -->
  <rect x="180" y="85" width="6" height="5" fill="#1C2117"/>
  <rect x="195" y="88" width="6" height="5" fill="#1C2117"/>
  <rect x="210" y="95" width="6" height="5" fill="#1C2117"/>
  <rect x="230" y="115" width="6" height="5" fill="#1C2117"/>
  <rect x="245" y="135" width="6" height="5" fill="#1C2117"/>
  <rect x="250" y="155" width="6" height="5" fill="#1C2117"/>
  <rect x="235" y="175" width="6" height="5" fill="#1C2117"/>
  <rect x="215" y="185" width="6" height="5" fill="#1C2117"/>
  <rect x="195" y="195" width="6" height="5" fill="#1C2117"/>
  <rect x="175" y="200" width="6" height="5" fill="#1C2117"/>

  <!-- Head with two black streaks behind eye -->
  <ellipse cx="80" cy="110" rx="12" ry="8" fill="#4B543F" transform="rotate(-30 80 110)"/>
  <!-- Two black streaks running backward from eye -->
  <line x1="82" y1="108" x2="92" y2="114" stroke="#141710" stroke-width="2"/>
  <line x1="80" y1="113" x2="88" y2="120" stroke="#141710" stroke-width="2"/>

  <!-- Eye -->
  <circle cx="78" cy="107" r="2.8" fill="#BFA342"/>
  <circle cx="78" cy="107" r="1.6" fill="#0E100B"/>

  <!-- Non-Venomous Badge -->
  <rect x="16" y="16" width="130" height="26" rx="6" fill="#27AE60" fill-opacity="0.15"/>
  <text x="24" y="34" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#27AE60">NON-VENOMOUS</text>
</svg>
