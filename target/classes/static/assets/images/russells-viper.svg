<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bgViper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5EFE6"/>
      <stop offset="100%" stop-color="#E2D4C3"/>
    </linearGradient>
    <radialGradient id="viperSpot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#543310"/>
      <stop offset="70%" stop-color="#2D1B07"/>
      <stop offset="100%" stop-color="#1A0F04"/>
    </radialGradient>
  </defs>
  <rect width="400" height="250" rx="12" fill="url(#bgViper)"/>
  
  <ellipse cx="200" cy="215" rx="150" ry="20" fill="#559E83" opacity="0.25"/>

  <!-- Thick Stout Coiled Viper Body -->
  <path d="M80 180 C90 130, 200 130, 240 160 C280 190, 340 180, 330 140 C320 100, 250 80, 200 100 C150 120, 120 90, 140 60" 
        stroke="#9B7348" stroke-width="36" stroke-linecap="round" fill="none"/>

  <!-- 3 Chains of Eye-like spots with white borders -->
  <!-- Spot 1 -->
  <ellipse cx="145" cy="75" rx="14" ry="10" fill="url(#viperSpot)" stroke="#FFFFFF" stroke-width="2" transform="rotate(-25 145 75)"/>
  <!-- Spot 2 -->
  <ellipse cx="180" cy="95" rx="15" ry="11" fill="url(#viperSpot)" stroke="#FFFFFF" stroke-width="2" transform="rotate(-15 180 95)"/>
  <!-- Spot 3 -->
  <ellipse cx="225" cy="95" rx="16" ry="12" fill="url(#viperSpot)" stroke="#FFFFFF" stroke-width="2" transform="rotate(10 225 95)"/>
  <!-- Spot 4 -->
  <ellipse cx="270" cy="105" rx="17" ry="12" fill="url(#viperSpot)" stroke="#FFFFFF" stroke-width="2" transform="rotate(30 270 105)"/>
  <!-- Spot 5 -->
  <ellipse cx="320" cy="135" rx="16" ry="12" fill="url(#viperSpot)" stroke="#FFFFFF" stroke-width="2" transform="rotate(60 320 135)"/>
  <!-- Spot 6 -->
  <ellipse cx="295" cy="175" rx="16" ry="12" fill="url(#viperSpot)" stroke="#FFFFFF" stroke-width="2" transform="rotate(-10 295 175)"/>
  <!-- Spot 7 -->
  <ellipse cx="240" cy="165" rx="16" ry="12" fill="url(#viperSpot)" stroke="#FFFFFF" stroke-width="2" transform="rotate(-20 240 165)"/>
  <!-- Spot 8 -->
  <ellipse cx="180" cy="150" rx="15" ry="11" fill="url(#viperSpot)" stroke="#FFFFFF" stroke-width="2" transform="rotate(15 180 150)"/>
  <!-- Spot 9 -->
  <ellipse cx="120" cy="165" rx="14" ry="10" fill="url(#viperSpot)" stroke="#FFFFFF" stroke-width="2" transform="rotate(40 120 165)"/>

  <!-- Triangular Flat Viper Head -->
  <path d="M140 60 L125 35 L155 35 Z" fill="#6B4826" stroke="#4A3016" stroke-width="2"/>
  <ellipse cx="140" cy="45" rx="14" ry="10" fill="#7D552C"/>
  <circle cx="130" cy="40" r="3" fill="#D4AF37"/>
  <line x1="130" y1="38" x2="130" y2="42" stroke="#000000" stroke-width="1.5"/>
  <circle cx="150" cy="40" r="3" fill="#D4AF37"/>
  <line x1="150" y1="38" x2="150" y2="42" stroke="#000000" stroke-width="1.5"/>

  <!-- Deep Nostril / Pit -->
  <circle cx="137" cy="33" r="1.5" fill="#1A0F04"/>
  <circle cx="143" cy="33" r="1.5" fill="#1A0F04"/>

  <!-- Identification Badge -->
  <rect x="16" y="16" width="130" height="26" rx="6" fill="#D9381E" fill-opacity="0.15"/>
  <text x="24" y="34" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#D9381E">VENOMOUS (Big Four)</text>
</svg>
