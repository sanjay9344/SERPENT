<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCobra" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF4F2"/>
      <stop offset="100%" stop-color="#D7E8E4"/>
    </linearGradient>
    <radialGradient id="hoodGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#9C7653"/>
      <stop offset="70%" stop-color="#5C4033"/>
      <stop offset="100%" stop-color="#3D2B1F"/>
    </radialGradient>
  </defs>
  <rect width="400" height="250" rx="12" fill="url(#bgCobra)"/>
  
  <!-- Shadow / Habitat ground -->
  <ellipse cx="200" cy="225" rx="140" ry="18" fill="#559E83" opacity="0.25"/>

  <!-- Coiled Body Base -->
  <path d="M120 220 C 130 195, 270 195, 280 220 C 260 235, 140 235, 120 220 Z" fill="#4A3525"/>
  <path d="M140 215 C 160 200, 240 200, 260 215 C 240 226, 160 226, 140 215 Z" fill="#6E5037"/>

  <!-- Upright Body Column -->
  <path d="M185 220 L185 140 C185 130, 215 130, 215 140 L215 220 Z" fill="#5C4033"/>
  <path d="M192 145 L192 215 C197 218, 203 218, 208 215 L208 145 Z" fill="#E8D8C8" opacity="0.9"/>
  <!-- Ventral bands -->
  <line x1="192" y1="160" x2="208" y2="160" stroke="#4A3525" stroke-width="2"/>
  <line x1="192" y1="175" x2="208" y2="175" stroke="#4A3525" stroke-width="2"/>
  <line x1="192" y1="190" x2="208" y2="190" stroke="#4A3525" stroke-width="2"/>

  <!-- Flared Hood -->
  <path d="M200 135 C150 120, 140 60, 190 45 C195 44, 205 44, 210 45 C260 60, 250 120, 200 135 Z" fill="url(#hoodGrad)"/>

  <!-- Spectacle Marking on Hood (Iconic Naja naja) -->
  <path d="M178 78 C172 70, 172 60, 180 55 C188 50, 195 62, 195 70 C195 78, 184 84, 178 78 Z" fill="#FFF2DF" stroke="#2B1A0E" stroke-width="2"/>
  <path d="M222 78 C228 70, 228 60, 220 55 C212 50, 205 62, 205 70 C205 78, 216 84, 222 78 Z" fill="#FFF2DF" stroke="#2B1A0E" stroke-width="2"/>
  <path d="M195 68 C198 65, 202 65, 205 68" stroke="#FFF2DF" stroke-width="3" stroke-linecap="round"/>
  <circle cx="182" cy="66" r="3" fill="#2B1A0E"/>
  <circle cx="218" cy="66" r="3" fill="#2B1A0E"/>

  <!-- Head & Snout -->
  <path d="M192 50 C192 38, 208 38, 208 50 C208 55, 192 55, 192 50 Z" fill="#3D2B1F"/>
  <circle cx="195" cy="46" r="2.5" fill="#E5A93C"/>
  <circle cx="195" cy="46" r="1.2" fill="#000000"/>
  <circle cx="205" cy="46" r="2.5" fill="#E5A93C"/>
  <circle cx="205" cy="46" r="1.2" fill="#000000"/>

  <!-- Tongue Flick -->
  <path d="M200 38 L200 28 L196 23 M200 28 L204 23" stroke="#D9381E" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Educational Identification Badge in SVG -->
  <rect x="16" y="16" width="130" height="26" rx="6" fill="#D9381E" fill-opacity="0.15"/>
  <text x="24" y="34" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#D9381E">VENOMOUS (Big Four)</text>
</svg>
