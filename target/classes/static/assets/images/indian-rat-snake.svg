<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bgRat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6F1"/>
      <stop offset="100%" stop-color="#D9EADE"/>
    </linearGradient>
    <linearGradient id="ratScales" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#737A47"/>
      <stop offset="60%" stop-color="#555C31"/>
      <stop offset="100%" stop-color="#3A401C"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" rx="12" fill="url(#bgRat)"/>
  
  <ellipse cx="200" cy="215" rx="150" ry="18" fill="#559E83" opacity="0.25"/>

  <!-- Slender, Long, Agile Body Sweep -->
  <path d="M60 210 C120 180, 160 240, 230 190 C300 140, 310 80, 240 80 C180 80, 160 140, 100 130 C70 125, 70 85, 110 70 L140 60" 
        stroke="url(#ratScales)" stroke-width="20" stroke-linecap="round" fill="none"/>

  <!-- Distinctive Dark Lip Bars / Reticulations on Tail & Body -->
  <line x1="225" y1="185" x2="235" y2="195" stroke="#232712" stroke-width="2.5"/>
  <line x1="240" y1="175" x2="250" y2="185" stroke="#232712" stroke-width="2.5"/>
  <line x1="260" y1="160" x2="270" y2="170" stroke="#232712" stroke-width="2.5"/>
  <line x1="280" y1="140" x2="290" y2="150" stroke="#232712" stroke-width="2.5"/>
  <line x1="290" y1="115" x2="300" y2="125" stroke="#232712" stroke-width="2.5"/>
  <line x1="270" y1="85" x2="280" y2="95" stroke="#232712" stroke-width="2.5"/>
  <line x1="240" y1="75" x2="250" y2="85" stroke="#232712" stroke-width="2.5"/>
  <line x1="205" y1="85" x2="215" y2="95" stroke="#232712" stroke-width="2.5"/>
  <line x1="170" y1="115" x2="180" y2="125" stroke="#232712" stroke-width="2.5"/>

  <!-- Streamlined Head with Prominent Alert Eyes & Lip Bars -->
  <ellipse cx="140" cy="58" rx="15" ry="9" fill="#5F6736" transform="rotate(-15 140 58)"/>
  <!-- Subocular Lip Bars (Very Diagnostic for Rat Snake) -->
  <line x1="135" y1="62" x2="135" y2="67" stroke="#1D210F" stroke-width="2"/>
  <line x1="141" y1="62" x2="141" y2="67" stroke="#1D210F" stroke-width="2"/>
  <line x1="147" y1="60" x2="147" y2="65" stroke="#1D210F" stroke-width="2"/>

  <!-- Large round pupil (Non-venomous characteristic) -->
  <circle cx="138" cy="55" r="3.5" fill="#C2A649"/>
  <circle cx="138" cy="55" r="2.2" fill="#0D0F06"/>
  <circle cx="139" cy="54" r="0.7" fill="#FFFFFF"/>

  <!-- Fast tongue flick -->
  <path d="M153 54 L165 50 L170 47 M165 50 L170 53" stroke="#D9381E" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Non-Venomous Badge (Forest Green) -->
  <rect x="16" y="16" width="130" height="26" rx="6" fill="#27AE60" fill-opacity="0.15"/>
  <text x="24" y="34" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#27AE60">NON-VENOMOUS</text>
</svg>
