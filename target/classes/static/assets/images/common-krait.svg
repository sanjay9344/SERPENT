<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bgKrait" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAF1F0"/>
      <stop offset="100%" stop-color="#D2E3E0"/>
    </linearGradient>
    <linearGradient id="kraitScales" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14191C"/>
      <stop offset="50%" stop-color="#223035"/>
      <stop offset="100%" stop-color="#0E1214"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" rx="12" fill="url(#bgKrait)"/>
  
  <ellipse cx="200" cy="215" rx="145" ry="18" fill="#559E83" opacity="0.25"/>

