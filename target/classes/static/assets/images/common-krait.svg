  <path d="M315 178 L328 170" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <path d="M320 185 L333 177" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>

  <path d="M245 185 L255 197" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <path d="M252 189 L262 201" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>

