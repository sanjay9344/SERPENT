# ==========================================================
# SnakeGuard Application Configuration (Stage 1)
# ==========================================================

# Server Configuration
server.port=8080
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.name=SNAKEGUARD_SESSION

# MySQL Database Connectivity (Configurable via Environment Variables)
# To override, set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/snakeguard_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schema Initialization
# When MySQL is active, set to 'always' to auto-run schema.sql, or import schema.sql into MySQL.
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}
spring.sql.init.continue-on-error=true
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=2000

# Static Resource Handling (Frontend served from src/main/resources/static)
spring.web.resources.static-locations=classpath:/static/

# Logging
logging.level.root=INFO
logging.level.com.snakeguard=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.jdbc=DEBUG
